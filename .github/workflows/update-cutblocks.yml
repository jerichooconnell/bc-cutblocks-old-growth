name: Update proposed cutblocks

on:
  schedule:
    # Every Monday 09:00 UTC (~01:00/02:00 Pacific)
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch proposed cutblocks + admin boundaries
        run: python pipeline/01_fetch_proposed.py

      - name: Join against frozen old-growth reference and export site data
        run: python pipeline/02_join_and_export.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/proposed_cutblocks.geojson data/stats.json
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "Weekly data refresh: proposed cutblocks ($(date -u +%Y-%m-%d))"
            git push
          fi
